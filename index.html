<style>
:root{
  --white:#FFFFFF; --paper:#F4F7FC; --blue:#023B9F; --deep:#01245F;
  --yellow:#FFCF27; --text:#0B1533; --muted:#4A5678; --line:#D3DCEE;
  --alert:#A32219; --alert-bg:#FCEDEB; --coral:#FF4A3D; --cielo:#86ABC6; --on-coral:#2B0A05; --amber:#7E5200; --amber-bg:#FFF6E0;
  --disp:'Barlow Condensed',system-ui,-apple-system,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:16px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:0 18px calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}

.top{padding:22px 0 16px}
.logo{display:block;height:56px;width:auto;margin-bottom:12px}
.eyebrow{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px}
.eyebrow span{height:2px;flex:1;background:var(--yellow)}
h1{font-family:var(--disp);font-weight:700;font-size:38px;line-height:1.02;
  text-transform:uppercase;margin-top:8px;color:var(--deep)}
.sub{color:var(--muted);font-size:14px;margin-top:8px}

.now{background:var(--yellow);border-radius:12px;padding:14px 16px;margin:18px 0 0;
  width:100%;display:block}
.now u{display:block;text-decoration:none;font-family:var(--disp);font-size:12px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--deep);opacity:.85}
.now b{display:block;font-family:var(--disp);font-weight:700;font-size:24px;
  line-height:1.1;color:var(--deep);margin-top:2px}
.now i{display:block;font-style:normal;font-size:14px;color:var(--deep);opacity:.85;margin-top:3px}
.now.quiet{background:var(--white);border:1px solid var(--line)}
.now.quiet u,.now.quiet b,.now.quiet i{color:var(--text);opacity:1}
.now.quiet u{color:var(--blue);opacity:1}

.seg{display:flex;border:1px solid var(--blue);border-radius:10px;overflow:hidden;margin:20px 0}
.seg button{flex:1;font-family:var(--disp);font-size:15px;letter-spacing:.12em;
  text-transform:uppercase;padding:12px 8px;text-align:center;color:var(--blue);background:var(--white)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--white);font-weight:700}

.search{margin-bottom:16px}
.search input{width:100%;background:var(--white);border:1px solid var(--line);border-radius:10px;
  padding:15px;color:var(--text);font-family:var(--body);font-size:17px}
.search input::placeholder{color:#8B95B5}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(2,59,159,.18)}

.names{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.nrow{display:block;background:var(--white);padding:14px 15px;width:100%;font-size:16px;font-weight:500}
.nrow:hover,.nrow:focus-visible{background:var(--paper)}
.empty{padding:26px 4px;color:var(--muted);font-size:15px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--white);border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;text-align:center;min-width:54px}
.chip u{display:block;text-decoration:none;font-family:var(--disp);font-size:10px;
  letter-spacing:.12em;color:var(--muted)}
.chip b{display:block;font-family:var(--disp);font-weight:700;font-size:20px;
  line-height:1.15;color:var(--deep)}
.chip .tee{display:block;margin:6px auto 0}
.chip[aria-pressed="true"] .tee{stroke:var(--white)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.chip[aria-pressed="true"] u,.chip[aria-pressed="true"] b{color:var(--white)}

.back{font-family:var(--disp);font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--blue);padding:6px 0;display:inline-block}
.pname{font-family:var(--disp);font-weight:700;font-size:34px;text-transform:uppercase;
  line-height:1.05;margin-top:6px;color:var(--deep)}

.tabs{display:flex;gap:6px;margin:20px 0 6px;border-bottom:2px solid var(--line)}
.tab{font-family:var(--disp);font-size:15px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:9px 12px;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}

.day{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:24px 0 10px;
  display:flex;align-items:center;gap:10px}
.day em{font-style:normal;color:var(--deep)}
.day span{height:1px;flex:1;background:var(--line)}

.turno{background:var(--white);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px 15px;margin-bottom:10px;width:100%;display:block}
.turno:hover,.turno:focus-visible{border-color:var(--blue)}
.thead{display:block;margin-bottom:2px}
.hora{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.1;color:var(--deep);
  margin-right:9px}
.cat{display:inline-block;font-family:var(--disp);font-weight:700;font-size:15px;
  letter-spacing:.1em;color:var(--white);background:var(--blue);border-radius:5px;
  padding:2px 8px;vertical-align:3px;margin-right:6px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 7px;
  vertical-align:4px;margin-right:5px}
.tag.warn{color:var(--alert);border-color:var(--alert);background:var(--alert-bg)}
.tee{width:17px;height:17px;stroke-width:1;stroke-linejoin:round;stroke:var(--line)}
.tee.roja{fill:var(--coral)}
.tee.azul{fill:var(--cielo)}
.turno .tee,.sub .tee,.day .tee{vertical-align:-4px;margin-left:3px}
.now .tee{vertical-align:-4px;margin-left:7px;stroke:var(--deep)}
.now.quiet .tee{stroke:var(--line)}

.courts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}
.court{background:var(--paper);border:1px solid var(--line);border-radius:6px;
  padding:9px 4px;text-align:center;display:block}
.court u{display:block;text-decoration:none;font-family:var(--disp);font-size:10px;
  letter-spacing:.12em;color:var(--muted)}
.court b{display:block;font-family:var(--disp);font-weight:700;font-size:21px;
  line-height:1.1;color:#95A0C0;margin-top:1px}
.court.on{background:var(--yellow);border-color:var(--yellow)}
.court.on u,.court.on b{color:var(--deep)}
.court.cnt b{color:var(--deep)}
.allfloor{margin-top:12px;background:var(--blue);border-radius:8px;padding:10px 13px;display:block}
.allfloor b{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--white);margin-right:8px}
.allfloor i{font-style:normal;font-size:13px;color:var(--white)}

.mates{display:block;margin-top:11px;font-size:14px;color:var(--muted);line-height:1.55}
.mates b{display:block;color:var(--deep);font-weight:600;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:3px;font-family:var(--disp)}
.note{display:block;margin-top:10px;font-size:13px;line-height:1.5;color:var(--alert);
  background:var(--alert-bg);border-radius:6px;padding:8px 10px}
.note.soft{color:var(--amber);background:var(--amber-bg)}
.divs{display:block;margin-top:7px;font-size:13px;color:var(--muted);line-height:1.5}

.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.gcol{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.gcol h3{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--blue);margin-bottom:7px;
  display:flex;justify-content:space-between;gap:8px}
.gcol h3 em{font-style:normal;color:var(--muted)}
.gcol .p{display:block;font-size:14px;line-height:1.6;padding:2px 0;width:100%;color:var(--text)}
.gcol .p:hover{color:var(--blue)}
.gcol .p.me{color:var(--deep);font-weight:600;background:var(--yellow);
  border-radius:4px;padding:2px 6px;margin:1px -6px}
.gcol p.none{color:#8B95B5;font-size:13px}

.pool{margin-top:18px;background:var(--white);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px}
.pool h3{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.pool .hint{font-size:13px;color:var(--muted);margin-bottom:9px}
.pool .who{display:flex;flex-wrap:wrap;gap:6px}
.pool .who button{border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px}
.pool .who button:hover{border-color:var(--blue);color:var(--blue)}

.agitem{background:var(--white);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:9px;display:block}
.agitem.destacado{border-color:var(--yellow);background:#FFFBEF}
.aghead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.agfecha{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--deep)}
.aghora{font-family:var(--disp);font-size:14px;color:var(--muted)}
.agmodo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);
  border:1px solid var(--blue);border-radius:5px;padding:2px 7px}
.agmodo.presencial{color:var(--deep);border-color:var(--yellow);background:var(--yellow)}
.agtxt{font-size:14px;color:var(--text);line-height:1.5}
.aglink{display:inline-block;margin-top:6px;font-size:13px;color:var(--blue);
  text-decoration:underline}
.tor{margin-top:22px}
.tor h3{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--deep);margin-bottom:10px}
.torgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.torcol{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.torcol h4{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.torcol p{font-size:13px;color:var(--text);line-height:1.6}
.torboys{margin-top:9px;font-size:12px;color:var(--alert);font-weight:600}
@media(min-width:520px){.torgrid{grid-template-columns:1fr 1fr}}

.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  font-size:13px;color:var(--muted);line-height:1.7}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.actions .btn{margin-top:0}
.btn.pri{background:var(--blue);color:var(--white);border-color:var(--blue)}
.btn.pri:hover{background:var(--deep);border-color:var(--deep)}
.btn{display:inline-block;font-family:var(--disp);font-size:14px;letter-spacing:.12em;
  text-transform:uppercase;border:1px solid var(--blue);color:var(--blue);
  border-radius:8px;padding:11px 16px;margin-top:16px;background:var(--white)}
.btn:hover{background:var(--blue);color:var(--white)}
@media(min-width:520px){.grid4{grid-template-columns:repeat(4,1fr)}h1{font-size:46px}}
@media(prefers-reduced-motion:no-preference){.turno{transition:border-color .15s ease}}
</style>

  if (x.courts.length) { h += courtStrip(x.courts); }
  if (x.ev) {
    h += '<span class="allfloor"><b>Evaluador</b><i>toda la sesión, las 4 canchas</i></span>';
  }
  if (x.courts.length) {
    var all = [], c, k;
    for (c = 0; c < x.courts.length; c++) {
      var m = mates(s, x.courts[c], me);
      for (k = 0; k < m.length; k++) { if (all.indexOf(m[k]) < 0) { all.push(m[k]); } }
    }
    if (all.length) { h += '<span class="mates"><b>Contigo en cancha</b>' + esc(all.join(", ")) + "</span>"; }
  }
  if (s.fix) { h += '<span class="note">' + esc(s.fix) + "</span>"; }
  if (s.alerta) { h += '<span class="note soft">' + esc(s.alerta) + "</span>"; }
  if (s.conflicto && s.conflicto[me]) {
    h += '<span class="note">' + esc(s.conflicto[me]) + "</span>";
  }
  return h + "</button>";
}

function proximoDe(list) {
  var now = new Date(), i;
  for (i = 0; i < list.length; i++) {
    if (startOf(list[i].s) > now) { return list[i]; }
  }
  return null;
}

function renderPerson(name) {
  var list = turnosDe(name), dup = conflictos(list), i;
  var h = '<button class="back" data-act="back">&larr; Volver</button>';
  h += '<h2 class="pname">' + esc(name) + "</h2>";
  var al = aliasesOf(name);
  if (al.length) {
    h += '<p class="divs">En el cuadre también aparece como ' + esc(al.join(", ")) + ".</p>";
  }
  var px = proximoDe(list);
  if (px) {
    var rol = px.courts.length ? "Cancha " + (px.courts[0] + 1) : "Evaluador";
    if (px.courts.length && px.ev) { rol += " y evaluador"; }
    h += '<button class="now" data-act="open" data-id="' + px.s.id + '">' +
      "<u>Tu próximo turno" + camisaIcono(px.s.dia_num) + "</u><b>" + esc(px.s.cat) + " &middot; " + esc(rol) + "</b>" +
      "<i>" + esc(px.s.dow) + " " + px.s.dia_num + " de agosto, " + esc(px.s.hora) +
      " &middot; Collazo</i></button>";
  }
  h += '<div class="tabs" role="tablist">' + tab("todos", "Todos") +
    tab("ayudante", "En cancha") + tab("evaluador", "Evaluando") + "</div>";
  var shown = [];
  for (i = 0; i < list.length; i++) {
    if (state.filter === "ayudante" && !list[i].courts.length) { continue; }
    if (state.filter === "evaluador" && !list[i].ev) { continue; }
    shown.push(list[i]);
  }
  if (!shown.length) { return h + '<p class="empty">No hay turnos en esta vista.</p>'; }
  var lastDay = -1;
  for (i = 0; i < shown.length; i++) {
    var s = shown[i].s;
    if (s.dia_num !== lastDay) {
      lastDay = s.dia_num;
      h += '<p class="day">' + esc(s.dow) + " <em>" + s.dia_num +
        " de agosto</em><span></span></p>";
    }
    h += turnoCard(shown[i], name, dup[s.dia_num + "|" + s.min]);
  }
  h += '<div class="actions">';
  h += '<button class="btn pri" data-act="wa" data-name="' + esc(name) +
    '">Enviar por WhatsApp</button>';
  h += '<button class="btn" data-act="mail" data-name="' + esc(name) +
    '">Enviar por correo</button>';
  h += '<button class="btn" data-act="ics" data-name="' + esc(name) +
    '">Descargar al calendario</button>';
  h += "</div>";
  return h;
}

function renderSession(id) {
  var s = byId(id), i, j;
  if (!s) { return '<p class="empty">Sesión no encontrada.</p>'; }
  var me = state.name;
  var h = '<button class="back" data-act="back">&larr; Volver</button>';
  h += '<h2 class="pname">' + esc(s.cat) + "</h2>";
  h += '<p class="sub">' + esc(s.dow) + " " + s.dia_num + " de agosto &middot; " +
    esc(s.hora) + " &middot; " + esc(s.sede || "Collazo");
  if (s.desarrollo) { h += " &middot; Desarrollo"; }
  h += camisaIcono(s.dia_num) + "</p>";
  if (s.divs && s.divs.length) {
    h += '<p class="divs">Divisiones: ' + esc(s.divs.join("  |  ")) + "</p>";
  }
  if (s.fix) { h += '<p class="note">' + esc(s.fix) + "</p>"; }
  if (s.alerta) { h += '<p class="note soft">' + esc(s.alerta) + "</p>"; }
  if (s.conflicto) {
    for (i in s.conflicto) {
      if (Object.prototype.hasOwnProperty.call(s.conflicto, i)) {
        h += '<p class="note">' + esc(s.conflicto[i]) + "</p>";
      }
    }
    i = 0;
  }
  h += '<div class="grid4">';
  for (i = 0; i < 4; i++) {
    h += '<div class="gcol"><h3>' + COURTS[i] + "<em>" + s.canchas[i].length + "</em></h3>";
    if (!s.canchas[i].length) {
      h += '<p class="none">Sin asignar</p>';
    } else {
      for (j = 0; j < s.canchas[i].length; j++) {
        var n = s.canchas[i][j];
        h += '<button class="p' + (n === me ? " me" : "") + '" data-act="person" data-name="' +
          esc(n) + '">' + esc(n) + "</button>";
      }
    }
    h += "</div>";
  }
  h += "</div>";
  if (s.evaluadores.length) {
    h += '<div class="gcol" style="margin-top:8px"><h3>Evaluadores<em>' +
      s.evaluadores.length + "</em></h3>";
    for (i = 0; i < s.evaluadores.length; i++) {
      var ev = s.evaluadores[i];
      h += '<button class="p' + (ev === me ? " me" : "") + '" data-act="person" data-name="' +
        esc(ev) + '">' + esc(ev) + "</button>";
    }
    h += "</div>";
  }
  var libres = libresEn(s.dia_num, s.min);
  h += '<div class="pool"><h3>Libres a esta hora</h3>';
  h += '<p class="hint">Nadie de esta lista tiene asignación en este bloque. ' +
    "Si alguien falla, llama de aquí.</p>";
  if (!libres.length) {
    h += '<p class="none">Todo el mundo está ocupado en este bloque.</p>';
  } else {
    h += '<div class="who">';
    for (i = 0; i < libres.length; i++) {
      h += '<button data-act="person" data-name="' + esc(libres[i]) + '">' +
        esc(libres[i]) + "</button>";
    }
    h += "</div>";
  }
  return h + "</div>";
}

function baseUrl() {
  try {
    if (location.protocol.indexOf("http") !== 0) { return ""; }
    return location.origin + location.pathname.replace(/index\.html$/, "");
  } catch (e) { return ""; }
}

function rolDe(x) {
  var r = [];
  if (x.courts.length) {
    var c = [], i;
    for (i = 0; i < x.courts.length; i++) { c.push(x.courts[i] + 1); }
    r.push("Cancha " + c.join(" y "));
  }
  if (x.ev) { r.push("Evaluador"); }
  return r.join(" y ");
}

function itinerario(name, compacto) {
  var list = turnosDe(name), i, out = [];
  out.push("Try-outs CVVB 2026-2027 - Cancha Collazo");
  out.push("Turnos de " + name);
  out.push("");
  var lastDay = -1, buf = [], cab = "";
  for (i = 0; i < list.length; i++) {
    var s = list[i].s, rol = rolDe(list[i]);
    if (s.dia_num !== lastDay) {
      if (compacto && buf.length) { out.push(cab + " " + buf.join(" / ")); buf = []; }
      lastDay = s.dia_num;
      cab = s.dow.toUpperCase() + " " + s.dia_num + " (camisa " + camisaDe(s.dia_num) + "):";
      if (!compacto) {
        out.push(s.dow.toUpperCase() + " " + s.dia_num +
          " DE AGOSTO - camisa " + camisaDe(s.dia_num));
      }
    }
    if (compacto) {
      buf.push(s.hora + " " + s.cat + " " + rol.replace("Cancha ", "C"));
    } else {
      out.push(s.hora + " - " + s.cat + " - " + rol);
      if (i + 1 >= list.length || list[i + 1].s.dia_num !== s.dia_num) { out.push(""); }
    }
  }
  if (compacto && buf.length) { out.push(cab + " " + buf.join(" / ")); }
  var base = baseUrl();
  if (base) {
    out.push("");
    out.push("Ver completo: " + base + "#p/" + slug(name));
  }
  return out.join("\n").replace(/\n{3,}/g, "\n\n");
}

function textoDe(name) {
  var t = itinerario(name, false);
  if (t.length > 780) { t = itinerario(name, true); }
  return t;
}

function openUrl(url) {
  try {
    var a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (e) {
    try { location.href = url; } catch (e2) { return; }
  }
}

function enviarWa(name) {
  try {
    openUrl("https://wa.me/?text=" + encodeURIComponent(textoDe(name)));
  } catch (e) { alert("No se pudo abrir WhatsApp."); }
}

function enviarMail(name) {
  try {
    var asunto = "Turnos try-outs CVVB - " + name;
    openUrl("mailto:?subject=" + encodeURIComponent(asunto) +
      "&body=" + encodeURIComponent(textoDe(name)));
  } catch (e) { alert("No se pudo abrir el correo."); }
}

function camisaDe(dia) { return (dia % 2) ? "roja" : "azul"; }
function camisaIcono(dia) {
  return '<svg class="tee ' + camisaDe(dia) + '" viewBox="0 0 24 24" ' +
    'aria-hidden="true" focusable="false"><path d="M8.4 3 3.2 5.6 1.6 9.8l3.4 1.3 ' +
    '1-1.7V21h12V9.4l1 1.7 3.4-1.3-1.6-4.2L15.6 3a3.7 3.7 0 0 1-7.2 0Z"/></svg>';
}

function pad(n) { return n < 10 ? "0" + n : "" + n; }

function icsFor(name) {
  var list = turnosDe(name), i;
  var out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//CVVB//Try-outs 2026//ES", "CALSCALE:GREGORIAN"];
  for (i = 0; i < list.length; i++) {
    var s = list[i].s;
    var d = "202608" + pad(s.dia_num);
    var sh = Math.floor(s.min / 60), sm = s.min % 60;
    var e = s.min + DUR, eh = Math.floor(e / 60), em = e % 60;
    var role = list[i].courts.length ? "Cancha " + (list[i].courts[0] + 1) : "Evaluador";
    if (list[i].courts.length && list[i].ev) { role += " + Evaluador"; }
    var dv = (s.divs && s.divs.length) ? " Divisiones: " + s.divs.join(", ") + "." : "";
    out.push("BEGIN:VEVENT");
    out.push("UID:cvvb-" + s.id + "-" + slug(name) + "@vaqueros");
    out.push("DTSTAMP:20260726T120000Z");
    out.push("DTSTART:" + d + "T" + pad(sh) + pad(sm) + "00");
    out.push("DTEND:" + d + "T" + pad(eh) + pad(em) + "00");
    out.push("SUMMARY:Try-out " + s.cat + " - " + role);
    out.push("LOCATION:" + (s.sede || "Collazo"));
    out.push("DESCRIPTION:Try-outs CVVB 2026-2027. Camisa " + camisaDe(s.dia_num) + ". Categoría " + s.cat + ". " + role + "." + dv);
    out.push("END:VEVENT");
  }
  out.push("END:VCALENDAR");
  return out.join("\r\n");
}

function download(name) {
  try {
    var blob = new Blob([icsFor(name)], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "turnos-" + slug(name) + ".ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  } catch (e) {
    alert("No se pudo generar el archivo en este navegador.");
  }
}

function writeHash() {
  var h = "";
  if (state.mode === "agenda" && state.open < 0) {
    h = "ag";
  } else if (state.open >= 0) {
    h = (state.from === "dias" ? "d/" + state.day : "p/" + slug(state.name || "")) +
      "/" + state.open;
    if (state.from !== "dias" && !state.name) { h = "d/" + state.day + "/" + state.open; }
  } else if (state.name) {
    h = "p/" + slug(state.name);
  } else if (state.mode === "dias") {
    h = "d/" + state.day;
  }
  try {
    if (!h) {
      if (location.hash) {
        if (window.history && history.replaceState) {
          history.replaceState(null, "", location.pathname + location.search);
        } else {
          location.hash = "";
        }
      }
      return;
    }
    if (location.hash.replace(/^#/, "") !== h) { location.hash = h; }
  } catch (e) { return; }
}

function readHash() {
  var raw = "";
  try { raw = location.hash.replace(/^#/, ""); } catch (e) { raw = ""; }
  state.name = ""; state.open = -1;
  if (!raw) { state.mode = "personas"; state.from = "personas"; return; }
  var parts = raw.split("/"), head = parts[0], rest = parts.slice(1), i, j;
  if (head === "ag") { state.mode = "agenda"; state.from = "agenda"; return; }
  if (head !== "p" && head !== "d") { head = "p"; rest = parts; }
  if (head === "d") {
    state.mode = "dias"; state.from = "dias";
    var d = parseInt(rest[0], 10);
    if (!isNaN(d)) { state.day = d; }
    if (rest[1] !== undefined) {
      var n = parseInt(rest[1], 10);
      if (!isNaN(n)) { state.open = n; }
    }
    return;
  }
  state.mode = "personas"; state.from = "personas";
  var who = decodeURIComponent(rest[0] || "");
  for (i = 0; i < PEOPLE.length; i++) {
    if (slug(PEOPLE[i]) === who) { state.name = PEOPLE[i]; }
    var a = aliasesOf(PEOPLE[i]);
    for (j = 0; j < a.length; j++) { if (slug(a[j]) === who) { state.name = PEOPLE[i]; } }
  }
  if (rest[1] !== undefined) {
    var m = parseInt(rest[1], 10);
    if (!isNaN(m)) { state.open = m; }
  }
}

function bindSearch() {
  var q = document.getElementById("q");
  if (!q) { return; }
  q.addEventListener("input", function () {
    var keep = q.value, pos = q.selectionStart;
    state.q = keep;
    document.getElementById("app").innerHTML = renderPersonas();
    var q2 = document.getElementById("q");
    if (q2) { q2.focus(); q2.value = keep; q2.setSelectionRange(pos, pos); }
    bindSearch();
  });
}

function render() {
  var app = document.getElementById("app");
  var sub = document.getElementById("sub");
  var foot = document.getElementById("foot");
  try {
    if (state.open >= 0) {
      sub.textContent = "Cuadro completo de la sesión. Toca un nombre para ver su semana.";
      app.innerHTML = renderSession(state.open);
    } else if (state.name) {
      sub.textContent = "Turnos en orden. Toca uno para ver la sesión completa.";
      app.innerHTML = renderPerson(state.name);
    } else if (state.mode === "dias") {
      sub.textContent = "Escoge un día y mira quién cubre cada cancha.";
      app.innerHTML = renderDias();
    } else if (state.mode === "agenda") {
      sub.textContent = "Fechas oficiales del club para la temporada 2026-2027.";
      app.innerHTML = renderAgenda();
    } else {
      sub.textContent = "Busca un nombre y mira cuándo y en qué cancha le toca.";
      app.innerHTML = renderPersonas();
      bindSearch();
    }
    foot.innerHTML = DATA.length + " sesiones &middot; 1 al 17 de agosto de 2026 " +
      "&middot; Cancha Collazo<br>Cuadre oficial de ayudantes cruzado con el calendario " +
      "de try-outs. Si algo no cuadra, avisa a coordinación.";
  } catch (e) {
    app.innerHTML = '<p class="empty">Hubo un problema mostrando los turnos.</p>';
  }
}

document.addEventListener("click", function (e) {
  var t = e.target;
  while (t && t !== document.body && !t.getAttribute("data-act")) { t = t.parentNode; }
  if (!t || !t.getAttribute) { return; }
  var act = t.getAttribute("data-act");
  if (!act) { return; }
  try {
    if (act === "mode") {
      state.mode = t.getAttribute("data-m");
      state.from = state.mode;
      state.name = ""; state.open = -1;
    } else if (act === "person") {
      state.name = t.getAttribute("data-name");
      state.mode = "personas"; state.from = "personas";
      state.open = -1; state.filter = "todos";
    } else if (act === "day") {
      state.day = parseInt(t.getAttribute("data-d"), 10);
      state.from = "dias"; state.open = -1;
    } else if (act === "now") {
      state.day = parseInt(t.getAttribute("data-d"), 10);
      state.mode = "dias"; state.from = "dias";
      state.open = parseInt(t.getAttribute("data-id"), 10);
    } else if (act === "open") {
      state.open = parseInt(t.getAttribute("data-id"), 10);
    } else if (act === "back") {
      if (state.open >= 0) {
        state.open = -1;
      } else {
        state.name = ""; state.filter = "todos";
      }
    } else if (act === "filter") {
      state.filter = t.getAttribute("data-f");
    } else if (act === "ics") {
      download(t.getAttribute("data-name"));
      return;
    } else if (act === "wa") {
      enviarWa(t.getAttribute("data-name"));
      return;
    } else if (act === "mail") {
      enviarMail(t.getAttribute("data-name"));
      return;
    }
    writeHash();
    render();
  } catch (err) { return; }
});

window.addEventListener("hashchange", function () { readHash(); render(); });

try {
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { return; });
    });
  }
} catch (e) { /* sin service worker */ }

readHash();
render();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
